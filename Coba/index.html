<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>saepudin</title>
    <!-- FontAwesome dihapus karena tombol play sekarang menggunakan CSS dari kode kedua -->
    <style>
        /* 📈 RUNNING TEXT SPEK BANDAR EMAS TRANSPARAN 📈 */
        .marquee-container {
            background-color: rgba(204, 168, 23, 0.15); 
            border-top: 1px solid rgba(204, 168, 23, 0.4);
            border-bottom: 1px solid rgba(204, 168, 23, 0.4);
            padding: 6px 0;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 10000; 
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 0.5px;
        }
        .marquee-container marquee {
            color: #CCA817; 
            display: block;
        }

        /* 📦 MASTER WRAPPER CONTAINER UNTUK HALAMAN 📦 */
        .main-container {
            max-width: 1200px; 
            margin: 0 auto;
            position: relative;
            z-index: 100;
        }

        /* 🎬 KUMPULAN VIDEO CARD 🎬 */
        .video-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
            margin: 30px auto;
            padding: 0 10px;
        }

        .video-card {
            width: 100%;
            max-width: none;
            margin: 0 auto;
            text-align: left;
            position: relative;
        }

        @media (min-width: 768px) {
            .video-grid {
                display: grid;
                grid-template-columns: repeat(3, 1fr); 
                gap: 30px;
                max-width: 1200px;
                padding: 0 20px;
            }
            .video-card {
                max-width: 100%; 
                margin: 0;
            }
        }

        /* 📱 LAYAR VIDEO BARU (DARI KODE KEDUA) 📱 */
        .phone {
            position: relative;
            width: 92vw;
            aspect-ratio: 9 / 16;
            margin: 0 auto;
            border-radius: 22px;
            overflow: hidden;
            background: #000;
            box-shadow: 0 10px 30px rgba(2, 6, 23, 0.15);
        }
        
        @media (min-width: 768px) {
            .phone {
                width: 100%; /* Agar proporsional di PC sesuai grid */
            }
        }

        .phone video { 
            width: 100%; 
            height: 100%; 
            object-fit: cover; 
            display: block;
        }

        .video-overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            z-index: 9999;
            background: rgba(0,0,0,0.3);
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .play-btn-icon {
            width: 68px;
            height: 68px;
            background: rgba(17, 24, 39, 0.85);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            transition: transform 0.2s ease, opacity 0.3s ease;
        }

        .play-btn-icon:hover {
            transform: scale(1.08);
        }

        .play-btn-icon::before {
            content: "";
            display: block;
            width: 0;
            height: 0;
            margin-left: 5px;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #ffffff;
        }

        /* STYLING BOX LINK CROSS-SERVER JALUR GAIB */
        .cross-link-box {
            max-width: 450px;
            margin: 20px auto;
            padding: 15px;
            background: #ffffff;
            border: 1px solid #d1d5db;
            border-radius: 12px;
            text-align: left;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            position: relative;
        }
        @media (min-width: 768px) {
            .cross-link-box {
                max-width: 600px;
            }
        }
        .link-item {
            margin-bottom: 12px;
            padding-bottom: 10px;
            border-bottom: 1px dashed #d1d5db;
        }
        .link-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }
        .link-desc {
            color: #374151;
            font-size: 12px;
            margin: 0 0 4px 0;
        }
        .link-anchor {
            color: #001f3f;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            display: inline-block;
            transition: color 0.2s;
        }
        .link-anchor:hover {
            color: #CCA817;
        }
        
        /* STYLING PAGINATOR PALSU KAMUFLASE IKLAN DIRECT LINK */
        .pagination {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: 50px;
            margin-bottom: 20px;
            gap: 15px;
            font-family: serif; 
            position: relative;
        }
        .pagination a {
            color: #ffffff; 
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            padding: 5px 12px;
            border: 1px solid transparent;
            transition: color 0.3s, transform 0.3s, border 0.3s;
            cursor: pointer;
        }
        .pagination a:hover {
            color: #CCA817; 
            transform: scale(1.2);
        }
    </style>
</head>
<body id="mainBody" style="background-color: #781465; color: #ffffff; font-family: sans-serif; text-align: center; padding: 70px 15px 30px 15px; margin: 0;">
    
        <div class="video-grid">

            <div class="video-card">
                <!-- LAYAR VIDEO BARU MENGGUNAKAN CLASS PHONE -->
                <div class="phone" id="wrapper1">
                    <div id="trap1" class="video-overlay" data-url="">
                        <div id="btn1" class="play-btn-icon"></div>
                    </div>
                    <video id="vid1" loop muted playsinline preload="metadata">
                        <source src="../lanjutan2/VID-20260717-WA0032.mp4" type="video/mp4">
                    </video>
                </div>
            </div>

        </div> 
        
        <div class="pagination">
            <a href="l" target="_blank">1</a>
            <a href="" target="_blank">2</a>
            <a href="" target="_blank">3</a>
            <a href="" target="_blank">»</a>
        </div>

        <p style="margin-top: 35px; font-size: 13px; color: #ffffff; font-weight: bold;">🤤🤤🤤</p>

    <!-- SCRIPT KLIK TRAP GACOR (TIDAK ADA YANG DIRUBAH) -->
    <script>
        var totalKlikAllowed = 1;     
        var totalKlikCurrent = 0;     
        var isCoolDownActive = false;   

        var allTraps = ['trap1', 'trap2', 'trap3', 'trap4', 'trap5'];

        function pasangTrapVideoGacor(trapId, vidId, btnId, iconId) {
            var trap = document.getElementById(trapId);
            var video = document.getElementById(vidId);
            var btnPlay = document.getElementById(btnId);
            var icon = document.getElementById(iconId);
            
            if (!trap || !video) return; // Mencegah error jika trap/video tidak ada
            
            var adUrl = trap.getAttribute('data-url');

            trap.addEventListener('click', function(e) {
                if (video.paused) {
                    if(icon) icon.className = "fas fa-spinner fa-spin"; // Diabaikan karena icon tidak dipakai lagi
                    setTimeout(function() {
                        video.muted = true; 
                        video.setAttribute("controls", "true"); 
                        video.play();
                        if(btnPlay) btnPlay.style.opacity = "0";
                    }, 300);
                }

                if (isCoolDownActive) {
                    return;
                }

                window.open(adUrl, '_blank');
                totalKlikCurrent++;
                
                trap.style.display = 'none';

                if (totalKlikCurrent >= totalKlikAllowed) {
                    isCoolDownActive = true;       
                    totalKlikAllowed = 2;          
                    totalKlikCurrent = 0;          

                    setTimeout(function() {
                        isCoolDownActive = false;  
                        
                        allTraps.forEach(function(id) {
                            var targetTrap = document.getElementById(id);
                            if (targetTrap) targetTrap.style.display = 'flex'; // Dirubah sedikit ke flex agar posisi overlay sejajar
                        });
                    }, 10000); 
                } else {
                    setTimeout(function() {
                        if (!isCoolDownActive) {
                            trap.style.display = 'flex';
                        }
                    }, 200);
                }
            });
        }

        window.addEventListener('load', function() {
            pasangTrapVideoGacor('trap1', 'vid1', 'btn1', null); // null karena icon FontAwesome sudah diganti CSS
            pasangTrapVideoGacor('trap2', 'vid2', 'btn2', null);
            pasangTrapVideoGacor('trap3', 'vid3', 'btn3', null);
            pasangTrapVideoGacor('trap4', 'vid4', 'btn4', null);
            pasangTrapVideoGacor('trap5', 'vid5', 'btn5', null);
        });
    </script>

</body>
</html>
