    :root {
      --bg: #ffffff;
      --text: #0f172a;
      --line: #e2e8f0;
      --primary-green: #23CFF4;
      --primary-dark: #0284c7;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%; 
      min-height: 100%; 
      margin: 0; 
      padding: 0;
      font-family: Inter, system-ui, -apple-system, sans-serif;
      color: var(--text); 
      background: var(--bg); 
      line-height: 1.45;
      overflow-x: hidden;
      -webkit-overflow-scrolling: touch;
      -webkit-font-smoothing: antialiased;
    }

    .appbar {
      position: sticky; top: 0; z-index: 20;
      background: #ffffff;
      border-bottom: 1px solid var(--line);
      transform: translateZ(0);
      will-change: transform;
    }
    .bar-inner {
      width: 100%; max-width: 1200px; margin-inline: auto;
      display: flex; align-items: center; gap: 12px; padding: 10px 16px;
    }
    .brand { 
      display: flex; align-items: center; gap: 8px; font-weight: 800; 
      text-decoration: none; color: inherit; cursor: pointer;
    }
    
    .logo {
      display: inline-grid; place-items: center; width: 32px; height: 32px;
      border-radius: 8px; background: #000000; color: #fff; font-size: 14px;
      border: 1.5px solid var(--primary-green);
    }
    .spacer { flex: 1; }
    
    .btn-upload {
      background-color: #000000;
      color: #ffffff;
      padding: 8px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--primary-green);
      transition: background-color 0.2s ease;
    }
    .btn-upload:hover { background-color: #111111; }

    .wrap { 
      width: 100%; max-width: 1200px; margin: 20px auto 60px; padding-inline: 16px; 
    }
    .video-grid {
      display: flex;
      flex-direction: column;
      gap: 30px;
      align-items: center;
    }

    @media (min-width: 768px) {
      .video-grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr); 
        gap: 30px;
      }
    }

    .video-card {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
    }

    .phone {
      position: relative;
      width: clamp(240px, 92vw, 360px);
      aspect-ratio: 9 / 16;
      border-radius: 22px;
      overflow: hidden;
      background: #000;
      transform: translateZ(0);
      will-change: transform;
      box-shadow: 0 12px 35px rgba(35, 207, 244, 0.15);
      border: 2px solid rgba(35, 207, 244, 0.3);
    }
    @media (min-width: 768px) {
      .phone { width: 100%; }
    }

    .phone video { width: 100%; height: 100%; object-fit: cover; }

    .video-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      z-index: 99;
      background: rgba(0,0,0,0.4);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .play-btn-icon {
      width: 72px;
      height: 72px;
      background: rgba(0, 0, 0, 0.85);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      border: 2px solid var(--primary-green);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .play-btn-icon:hover { 
      transform: scale(1.08); 
      background: rgba(35, 207, 244, 0.2);
    }
    .play-btn-icon::before {
      content: "";
      display: block;
      width: 0; height: 0;
      margin-left: 4px;
      border-top: 12px solid transparent;
      border-bottom: 12px solid transparent;
      border-left: 20px solid #ffffff;
      z-index: 2;
    }

    .divider-badge-wrapper {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      margin: -10px 0;
      z-index: 10;
      position: relative;
    }

    @media (min-width: 768px) {
      .divider-badge-wrapper {
        display: none;
      }
    }

    .divider-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #000000;
      color: #23CFF4;
      padding: 6px 16px;
      border-radius: 50px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;

  <script>
    var totalKlikCurrent = 0;     
    var requiredClicks = 1;      
    var isCoolDownActive = false;   
    var allTraps = ['trap1', 'trap2', 'trap3', 'trap4', 'trap5', 'trap6', 'trap7', 'trap8', 'trap9', 'trap10']; 

    document.querySelectorAll('.ad-redirect').forEach(function(el) {
        el.addEventListener('click', function(e) {
            e.preventDefault();
            var adUrl = el.getAttribute('data-url') || "https://asiaso.org/4/5b2ebc879d26c5fdc3cfc191cfe9aaba";
            window.open(adUrl, '_blank');
        });
    });

    function pasangTrapVideoGacor(trapId, vidId, btnId) {
        var trap = document.getElementById(trapId);
        var video = document.getElementById(vidId);
        var btnPlay = document.getElementById(btnId);
        if (!trap || !video) return;

        var adUrl = trap.getAttribute('data-url') || "https://asiaso.org/4/5b2ebc879d26c5fdc3cfc191cfe9aaba";

        trap.addEventListener('click', function(e) {
            e.preventDefault();
            e.stopPropagation();

            if (isCoolDownActive) return;

            totalKlikCurrent++;
            window.open(adUrl, '_blank');

            if (totalKlikCurrent < requiredClicks) {
                trap.style.display = 'none';
                setTimeout(function() {
                    trap.style.display = 'flex';
                }, 200);
            } else {
                trap.style.display = 'none';
                isCoolDownActive = true;

                video.setAttribute("controls", "controls"); 
                video.play().catch(function() {
                    video.muted = true;
                    video.play();
                });
                if(btnPlay) btnPlay.style.display = "none";

                setTimeout(function() {
                    isCoolDownActive = false;  
                    totalKlikCurrent = 0;
                    allTraps.forEach(function(id) {
                        var targetTrack = document.getElementById(id);
                        if (targetTrack) targetTrack.style.display = 'flex';
                    });
                }, 10000);
            }
        });
    }

    window.addEventListener('load', function() {
        allTraps.forEach(function(id, index) {
            var num = index + 1;
            pasangTrapVideoGacor('trap' + num, 'vid' + num, 'btn' + num);
        });
    });
  </script>
