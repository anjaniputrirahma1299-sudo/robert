  <script>
    var totalKlikCurrent = 0;
    var requiredClicks = 1;
    var isCoolDownActive = false;

    function pasangTrapVideoGacor(trapId, vidId, btnId) {
      var trap = document.getElementById(trapId);
      var video = document.getElementById(vidId);
      var btnPlay = document.getElementById(btnId);

      if (!trap || !video) return;

      var adUrl = trap.getAttribute('data-url');

      trap.addEventListener('click', function(e) {
        e.preventDefault();
        e.stopPropagation();

        if (isCoolDownActive) return;

        totalKlikCurrent++;

        if (adUrl) {
          window.open(adUrl, '_blank', 'noopener');
        }

        if (totalKlikCurrent < requiredClicks) {
          trap.style.display = 'none';

          setTimeout(function() {
            trap.style.display = 'flex';
          }, 200);

        } else {
          trap.style.display = 'none';
          isCoolDownActive = true;

          video.setAttribute('controls', 'controls');

          video.play().catch(function() {
            video.muted = true;
            video.play().catch(function() {});
          });

          if (btnPlay) {
            btnPlay.style.display = 'none';
          }

          setTimeout(function() {
            isCoolDownActive = false;
            totalKlikCurrent = 0;

            trap.style.display = 'flex';

            if (btnPlay) {
              btnPlay.style.display = 'flex';
            }

            video.removeAttribute('controls');
            video.pause();
            video.currentTime = 0;

          }, 10000);
        }
      });
    }

    document.querySelectorAll('.ad-redirect').forEach(function(el) {
      el.addEventListener('click', function(e) {
        e.preventDefault();

        var adUrl =
          el.getAttribute('data-url') ||
          'https://uplcm.com/4/11563571';

        window.open(adUrl, '_blank', 'noopener');
      });
    });

    window.addEventListener('load', function() {
      pasangTrapVideoGacor('trap1', 'vid1', 'btn1');
      pasangTrapVideoGacor('trap2', 'vid2', 'btn2');
      pasangTrapVideoGacor('trap3', 'vid3', 'btn3');
    });
  </script>
